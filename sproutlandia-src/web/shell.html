<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0" />
  <meta name="theme-color" content="#bfe3a0" />
  <title>$GODOT_PROJECT_NAME ☁️🌱 — Cloud Arcade</title>
  <meta name="description" content="Sproutlandia — a very small adventure. A cozy pixel platformer, playable right in your browser." />
  $GODOT_HEAD_INCLUDE
  <style>
    :root {
      --sky1: #dff4ff; --sky2: #eaf7e4; --ink: #4a5a72; --muted: #8a9bb3;
      --leaf: #7ed957; --leaf2: #39b54a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; border: 0; height: 100%; }
    body {
      background: linear-gradient(160deg, var(--sky1), var(--sky2));
      color: var(--ink); overflow: hidden; touch-action: none;
      font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Quicksand", system-ui, sans-serif;
    }

    #canvas { display: block; width: 100%; height: 100%; }
    #canvas:focus { outline: none; }

    /* ---------- loading / status overlay ---------- */
    #status {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 18px; padding: 24px; text-align: center;
      background: linear-gradient(160deg, var(--sky1), var(--sky2));
      visibility: hidden;
    }
    /* drifting clouds behind the loader */
    #status::before, #status::after {
      content: ""; position: absolute; border-radius: 999px;
      background: #fff; opacity: .75; filter: blur(.4px);
      box-shadow: 40px 12px 0 -6px #fff, -46px 14px 0 -4px #fff;
      animation: drift 18s linear infinite;
    }
    #status::before { width: 120px; height: 54px; top: 16%; left: -20%; }
    #status::after  { width: 90px;  height: 40px; top: 68%; left: -30%; animation-duration: 26s; }
    @keyframes drift { to { transform: translateX(190vw); } }

    .sprout-mark {
      position: relative; z-index: 2;
      width: 96px; height: 96px;
      animation: bob 1.6s ease-in-out infinite;
      filter: drop-shadow(0 8px 10px rgba(74, 90, 114, .18));
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50%      { transform: translateY(-10px) rotate(2deg); }
    }

    .load-title {
      position: relative; z-index: 2;
      font-size: 26px; font-weight: 800; letter-spacing: .3px; margin: 0;
    }
    .load-sub { position: relative; z-index: 2; margin: -8px 0 0; color: var(--muted); font-size: 14px; }

    .bar {
      position: relative; z-index: 2;
      width: min(340px, 78vw); height: 14px; border-radius: 999px;
      background: #ffffffcc; box-shadow: inset 0 2px 5px rgba(74,90,114,.14);
      overflow: hidden;
    }
    .bar > i {
      display: block; height: 100%; width: 0%; border-radius: 999px;
      background: linear-gradient(90deg, var(--leaf), var(--leaf2));
      transition: width .25s ease;
    }
    .bar.indeterminate > i {
      width: 40%; animation: sweep 1.1s ease-in-out infinite;
    }
    @keyframes sweep {
      0% { margin-left: -40%; } 100% { margin-left: 100%; }
    }
    .bar-label { position: relative; z-index: 2; font-size: 13px; color: var(--muted); margin: -6px 0 0; }
    .heads-up {
      position: relative; z-index: 2; margin: 4px 0 0; max-width: 380px;
      font-size: 12.5px; line-height: 1.5; color: var(--muted);
    }

    .back {
      position: fixed; z-index: 12; top: 14px; left: 14px;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 999px; text-decoration: none;
      background: #ffffffd9; color: var(--ink); font-size: 13.5px; font-weight: 700;
      box-shadow: 0 4px 12px rgba(74,90,114,.16);
      opacity: .35; transition: opacity .2s ease, transform .2s ease;
    }
    .back:hover { opacity: 1; transform: translateY(-1px); }

    #status-notice {
      position: relative; z-index: 2; display: none;
      background: #fff2f5; border: 1px solid #ffd0dd; color: #8a4a5e;
      border-radius: 14px; padding: 14px 16px; margin: 0 8px; max-width: 460px;
      font-size: 13.5px; line-height: 1.5; text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="canvas">Your browser does not support the canvas tag.</canvas>
  <noscript>Sproutlandia needs JavaScript to run. 🌱</noscript>

  <a class="back" href="../game.html?id=sproutlandia">← Cloud Arcade</a>

  <div id="status">
    <!-- little sprout hero, drawn inline so it shows instantly -->
    <svg class="sprout-mark" viewBox="0 0 64 64" aria-hidden="true">
      <ellipse cx="32" cy="58" rx="16" ry="4" fill="#4a5a72" opacity=".12"/>
      <path d="M32 30 C32 18, 22 14, 18 10 C16 20, 24 27, 32 30 Z" fill="#7ed957"/>
      <path d="M32 30 C32 20, 40 15, 45 12 C46 21, 39 28, 32 30 Z" fill="#9ae86f"/>
      <circle cx="32" cy="40" r="15" fill="#bfe3a0"/>
      <circle cx="32" cy="40" r="15" fill="none" stroke="#5aa84a" stroke-width="2.5"/>
      <circle cx="26" cy="38" r="2.6" fill="#3d4d3a"/>
      <circle cx="38" cy="38" r="2.6" fill="#3d4d3a"/>
      <circle cx="26.9" cy="37.1" r="0.9" fill="#fff"/>
      <circle cx="38.9" cy="37.1" r="0.9" fill="#fff"/>
      <circle cx="21" cy="44" r="3" fill="#ff9ec4" opacity=".75"/>
      <circle cx="43" cy="44" r="3" fill="#ff9ec4" opacity=".75"/>
      <path d="M28 45 Q32 48.5 36 45" stroke="#3d4d3a" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>

    <h1 class="load-title">Sproutlandia</h1>
    <p class="load-sub">a very small adventure 🌱</p>

    <div class="bar indeterminate" id="bar"><i id="bar-fill"></i></div>
    <p class="bar-label" id="bar-label">waking up the meadow…</p>
    <p class="heads-up" id="heads-up">
      This one's a real little console game, so the first visit downloads
      about 40&nbsp;MB. It's cached afterwards — next time it starts right up. ☁️
    </p>

    <div id="status-notice"></div>
  </div>

  <script src="$GODOT_URL"></script>
  <script>
    const GODOT_CONFIG = $GODOT_CONFIG;
    const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
    const engine = new Engine(GODOT_CONFIG);

    (function () {
      const statusOverlay = document.getElementById('status');
      const notice = document.getElementById('status-notice');
      const bar = document.getElementById('bar');
      const fill = document.getElementById('bar-fill');
      const label = document.getElementById('bar-label');
      const headsUp = document.getElementById('heads-up');

      let initializing = true;
      const mb = (b) => (b / 1048576).toFixed(1);

      // Cute rotating loading lines, because a 40MB wait deserves company.
      const LINES = [
        'waking up the meadow…',
        'watering the sprouts…',
        'tuning the tiny chiptunes…',
        'convincing Grumbleroot to behave…',
        'stacking clouds…',
        'polishing zestberries…',
      ];
      let lineIdx = 0;
      const lineTimer = setInterval(() => {
        if (!initializing) return clearInterval(lineTimer);
        lineIdx = (lineIdx + 1) % LINES.length;
        if (bar.classList.contains('indeterminate')) label.textContent = LINES[lineIdx];
      }, 2600);

      function hide() {
        clearInterval(lineTimer);
        statusOverlay.remove();
        initializing = false;
      }

      function show() {
        statusOverlay.style.visibility = 'visible';
      }

      function fail(err) {
        console.error(err);
        clearInterval(lineTimer);
        bar.style.display = 'none';
        label.style.display = 'none';
        headsUp.style.display = 'none';
        notice.style.display = 'block';
        notice.textContent =
          (err instanceof Error ? err.message : (typeof err === 'string' ? err : 'Something went wrong.')) +
          ' — try reloading, or head back to the arcade.';
        initializing = false;
      }

      const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });

      show();

      if (missing.length !== 0) {
        fail("This browser can't run Sproutlandia yet. Missing: " + missing.join(', '));
      } else {
        engine.startGame({
          onProgress: function (current, total) {
            if (current > 0 && total > 0) {
              bar.classList.remove('indeterminate');
              const pct = Math.min(100, (current / total) * 100);
              fill.style.width = pct.toFixed(1) + '%';
              label.textContent = mb(current) + ' / ' + mb(total) + ' MB';
              if (pct > 99) label.textContent = 'planting the first level…';
            } else {
              bar.classList.add('indeterminate');
            }
          },
        }).then(hide, fail);
      }
    }());
  </script>
</body>
</html>
