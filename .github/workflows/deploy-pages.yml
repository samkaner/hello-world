name: Deploy Orbital Breaker to GitHub Pages

on:
  push:
    branches:
      - claude/brick-breaker-game-repo-7g0iyd
    paths:
      - orbital-breaker/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

# Allow the workflow to enable Pages and publish the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let a newer run supersede an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true creates the Pages site via the API if it does not
        # exist yet, so no manual Settings toggle is required.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the game folder as the site root so the URL is clean:
          # https://<owner>.github.io/<repo>/
          path: orbital-breaker

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
